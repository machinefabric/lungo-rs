# The polyglot fixture: one Lean program generated for every language, whose end-to-end tests
# make the same assertions in each. Its host externs are the operations of two facilities
# (`Polyglot/Host.lean`); the exports `[assurance]` names each carry a proved claim.
project = "lean"

[assurance]
require-claims = ["Polyglot.factorial", "Polyglot.Tree.mirror", "Polyglot.divide", "Polyglot.scaledSum"]
