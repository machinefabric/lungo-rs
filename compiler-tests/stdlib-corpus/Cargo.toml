[package]
name = "stdlib-corpus"
version = "0.1.0"
edition = "2024"
publish = false
description = "The executable part of Lean's Init and Std libraries, generated as Rust (design §38)"

# A workspace of its own: the corpus is type-checked by a dedicated CI job, not by every build.
[workspace]

[dependencies]
patina = { path = "../../crates/patina" }

[build-dependencies]
patina-build = { path = "../../crates/patina-build" }
