[package]
name = "conformance-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Runs the Lean conformance programs through lungo's Rust and C backends"

[[bin]]
name = "conformance"
path = "src/main.rs"

[dependencies]
lungo.workspace = true
# The runtime's C ABI, which the programs generated in C link against.
lungo-runtime = { workspace = true, features = ["capi"] }

[dev-dependencies]
toml.workspace = true

[build-dependencies]
cc.workspace = true
lungo-build.workspace = true
toml.workspace = true
