[package]
name = "conformance-runner"
version = "0.1.0"
edition = "2024"
publish = false
description = "Runs the Lean conformance programs through patina's PureRust backend"

[[bin]]
name = "conformance"
path = "src/main.rs"

[dependencies]
patina = { path = "../../crates/patina" }

[dev-dependencies]
toml = "0.8"

[build-dependencies]
patina-build = { path = "../../crates/patina-build" }
toml = "0.8"
