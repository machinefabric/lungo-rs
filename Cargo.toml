[workspace]
members = [
    "crates/cargo-lean2rust",
    "crates/lean2rust",
    "crates/lean2rust-bir",
    "crates/lean2rust-build",
    "crates/lean2rust-codegen",
    "crates/lean2rust-protocol",
    "crates/lean2rust-runtime",
    "examples/session",
    "compiler-tests/runner",
    "compiler-tests/facade-runner",
    "compiler-tests/host",
    "compiler-tests/gates",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
