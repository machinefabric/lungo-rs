# Rendered from Cargo.toml.wstemplate by `wsb update`: edit the template, not Cargo.toml.

[workspace]
members = [
    "crates/cargo-lungo",
    "crates/lungo",
    "crates/lungo-bir",
    "crates/lungo-build",
    "crates/lungo-codegen",
    "crates/lungo-protocol",
    "crates/lungo-runtime",
    "examples/session",
    "compiler-tests/runner",
    "compiler-tests/facade-runner",
    "compiler-tests/host",
    "compiler-tests/shaping",
    "compiler-tests/gates",
]
resolver = "3"

[workspace.package]
version = "0.27.1270"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["Bahram Joharshamshiri <jowharshamshiri@gmail.com>"]
repository = "https://github.com/jowharshamshiri/lungo"
homepage = "https://github.com/jowharshamshiri/lungo"

[workspace.dependencies]
# The lungo crates are released together and depend on each other's unstable internals (the
# generated code, the Bridge IR, the worker protocol), so they require each other's exact
# version.
lungo = { path = "crates/lungo", version = "=0.27.1270" }
lungo-bir = { path = "crates/lungo-bir", version = "=0.27.1270" }
lungo-build = { path = "crates/lungo-build", version = "=0.27.1270" }
lungo-codegen = { path = "crates/lungo-codegen", version = "=0.27.1270" }
lungo-protocol = { path = "crates/lungo-protocol", version = "=0.27.1270" }
lungo-runtime = { path = "crates/lungo-runtime", version = "=0.27.1270" }

ciborium = "0.2.2"
libc = "0.2"
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
windows-sys = "0.59"
