# Rendered from Cargo.toml.wstemplate by `wsb update`: edit the template, not Cargo.toml.

[workspace]
members = [
    "crates/lungo",
    "crates/lungo-bir",
    "crates/lungo-build",
    "crates/lungo-capi",
    "crates/lungo-cli",
    "crates/lungo-codegen",
    "crates/lungo-driver",
    "crates/lungo-protocol",
    "crates/lungo-runtime",
    "tools/lungo-dist",
    "examples/session",
    "compiler-tests/runner",
    "compiler-tests/facade-runner",
    "compiler-tests/host",
    "compiler-tests/shaping",
    "compiler-tests/gates",
]
resolver = "3"

[workspace.package]
version = "1.64.2722"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["Bahram Joharshamshiri <jowharshamshiri@gmail.com>"]
repository = "https://github.com/machinefabric/lungo"
homepage = "https://github.com/machinefabric/lungo"

[workspace.dependencies]
# The lungo crates are released together and depend on each other's unstable internals (the
# generated code, the Bridge IR, the worker protocol), so they require each other's exact
# version.
lungo = { path = "crates/lungo", version = "=1.64.2722" }
lungo-bir = { path = "crates/lungo-bir", version = "=1.64.2722" }
lungo-build = { path = "crates/lungo-build", version = "=1.64.2722" }
lungo-codegen = { path = "crates/lungo-codegen", version = "=1.64.2722" }
lungo-driver = { path = "crates/lungo-driver", version = "=1.64.2722" }
lungo-protocol = { path = "crates/lungo-protocol", version = "=1.64.2722" }
lungo-runtime = { path = "crates/lungo-runtime", version = "=1.64.2722" }

cc = "1.2"
ciborium = "0.2.2"
clap = { version = "4.5", features = ["derive"] }
dunce = "1.0"
flate2 = "1.1"
libc = "0.2"
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
toml = "0.8"
ureq = "3.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
windows-sys = "0.59"
