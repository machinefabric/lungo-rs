[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lungo-py"
dynamic = ["version"]
description = "The Python support library of lungo's generated packages: the lungo runtime and the wire format"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Bahram Joharshamshiri", email = "jowharshamshiri@gmail.com" }]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/machinefabric/lungo"

[tool.hatch.version]
path = "src/lungo_py/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lungo_py"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
