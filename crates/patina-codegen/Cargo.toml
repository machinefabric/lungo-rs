[package]
name = "patina-codegen"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "The patina Rust backend: Bridge IR to Rust"
license = "Apache-2.0"

[dependencies]
patina-bir = { path = "../patina-bir", version = "0.1.0" }
patina-protocol = { path = "../patina-protocol", version = "0.1.0" }
patina-runtime = { path = "../patina-runtime", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
