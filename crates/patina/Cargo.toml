[package]
name = "patina"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Runtime and facade support for Rust code generated from Lean by patina"
license = "Apache-2.0"

[dependencies]
patina-runtime = { path = "../patina-runtime", version = "0.1.0" }
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1.0", optional = true }

[features]
# Serialize and deserialize patina's facade types with serde, so that generated types can derive
# `serde::Serialize`/`serde::Deserialize` (see `type_attribute`).
serde = ["dep:serde"]

[dev-dependencies]
serde_json = "1.0"
