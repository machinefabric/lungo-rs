[package]
name = "lungo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Runtime and facade types for Rust code generated from Lean by lungo-build"
keywords = ["lean", "lean4", "codegen", "formal-verification"]
categories = ["compilers", "development-tools::ffi"]
readme = "README.md"

[dependencies]
lungo-runtime.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
serde = { workspace = true, optional = true }

[features]
# Serialize and deserialize lungo's facade types with serde, so that generated types can derive
# `serde::Serialize`/`serde::Deserialize` (see `type_attribute`).
serde = ["dep:serde"]

[dev-dependencies]
serde_json.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
