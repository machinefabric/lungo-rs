[package]
name = "lungo-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The lungo command: generate C, Go, Python, Swift, TypeScript and Rust from Lean programs"
keywords = ["lean", "lean4", "codegen", "ffi", "protoc"]
categories = ["development-tools", "development-tools::ffi", "compilers"]

[[bin]]
name = "lungo"
path = "src/main.rs"
# A command: its documentation is the command reference (and the `lungo` crate's would be
# overwritten).
doc = false

# The test program is also the plugin it runs (see the file).
[[test]]
name = "plugin"
harness = false

[dependencies]
clap.workspace = true
flate2.workspace = true
lungo-build.workspace = true
lungo-driver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
toml.workspace = true
ureq.workspace = true

[build-dependencies]
serde_json.workspace = true
