[package]
name = "patina-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Compiles Lean projects into Rust at Cargo build time"
keywords = ["lean", "lean4", "codegen", "build", "formal-verification"]
categories = ["development-tools::build-utils", "compilers"]
readme = "README.md"

[dependencies]
blake3 = "1.8"
dunce = "1.0"
patina-bir.workspace = true
patina-codegen.workspace = true
patina-protocol.workspace = true
patina-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }
