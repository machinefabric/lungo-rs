[package]
name = "patina-build"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Build-script integration of Lean projects into Rust crates"
license = "Apache-2.0"

[dependencies]
blake3 = "1.8"
dunce = "1.0"
patina-bir = { path = "../patina-bir", version = "0.1.0" }
patina-codegen = { path = "../patina-codegen", version = "0.1.0" }
patina-protocol = { path = "../patina-protocol", version = "0.1.0" }
patina-runtime = { path = "../patina-runtime", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }
