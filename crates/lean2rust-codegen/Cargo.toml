[package]
name = "lean2rust-codegen"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "The lean2rust Rust backend: Bridge IR to Rust"
license = "Apache-2.0"

[dependencies]
lean2rust-bir = { path = "../lean2rust-bir", version = "0.1.0" }
lean2rust-protocol = { path = "../lean2rust-protocol", version = "0.1.0" }
lean2rust-runtime = { path = "../lean2rust-runtime", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
