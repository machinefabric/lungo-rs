[package]
name = "lungo-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The Lean runtime, in Rust, that generated code runs on. An internal part of lungo: depend on `lungo` and `lungo-build`."

[dependencies]
getrandom = "0.3"
libc.workspace = true
num-bigint.workspace = true
num-integer = "0.1"
num-traits.workspace = true
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[features]
# The C ABI of the runtime (`capi`): every primitive under a `lungo_`-prefixed C symbol, and the
# object, initialization and boundary API generated C programs use. Built into the prebuilt
# runtime library by `lungo-capi`.
capi = []
# Serialization of the wire format's type descriptions (`wire`), for code generators.
serde = ["dep:serde"]

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }
