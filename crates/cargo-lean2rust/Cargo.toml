[package]
name = "cargo-lean2rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Inspect and build Lean projects integrated with lean2rust"
license = "Apache-2.0"

[[bin]]
name = "cargo-lean2rust"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
lean2rust-bir = { path = "../lean2rust-bir", version = "0.1.0" }
lean2rust-build = { path = "../lean2rust-build", version = "0.1.0" }
lean2rust-codegen = { path = "../lean2rust-codegen", version = "0.1.0" }
lean2rust-protocol = { path = "../lean2rust-protocol", version = "0.1.0" }
serde_json = "1.0"
