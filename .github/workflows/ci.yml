name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The toolchain every project in this repository pins (`lean-toolchain`).
  LEAN_TOOLCHAIN: leanprover/lean4:v4.34.1
  # Keep compiled Lean workers inside the cached area.
  LUNGO_CACHE_DIR: ${{ github.workspace }}/.lungo-cache

jobs:
  lint:
    name: Format, lints, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - uses: ./.github/actions/setup-lean
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      # The runtime of the TypeScript binding.
      - run: cargo clippy -p lungo-runtime -p lungo-capi --features lungo-runtime/capi --target wasm32-wasip1 -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exclude: ""
          - os: macos-latest
            exclude: ""
          # LeanOracle mode links Lean's native runtime, which targets the GNU ABI on Windows;
          # the MSVC host runs everything else, including the differential test against
          # natively compiled Lean executables.
          - os: windows-latest
            exclude: --exclude facade-runner
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        working-directory: lungo-rs
    steps:
      # The support libraries are repositories of their own, beside this one in the lungo
      # repository; the bindings' end-to-end tests assemble them with the runtime.
      - uses: actions/checkout@v4
        with:
          path: lungo-rs
      - uses: actions/checkout@v4
        with:
          repository: machinefabric/lungo-go
          path: lungo-go
      - uses: actions/checkout@v4
        with:
          repository: machinefabric/lungo-py
          path: lungo-py
      - uses: actions/checkout@v4
        with:
          repository: machinefabric/lungo-ts
          path: lungo-ts
      - uses: actions/checkout@v4
        with:
          repository: machinefabric/lungo-swift
          path: lungo-swift
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The TypeScript binding's WebAssembly runtime; on Windows, the runtime cgo links.
          targets: ${{ runner.os == 'Windows' && 'wasm32-wasip1,x86_64-pc-windows-gnu' || 'wasm32-wasip1' }}
      - uses: ./lungo-rs/.github/actions/setup-lean
      # The toolchains of the language bindings' end-to-end tests (crates/lungo-cli/tests).
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: MinGW-w64 for cgo
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'C:\mingw64\bin' >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lungo-rs
      - uses: actions/cache@v4
        with:
          path: ${{ env.LUNGO_CACHE_DIR }}
          key: lungo-workers-${{ runner.os }}-${{ env.LEAN_TOOLCHAIN }}-${{ hashFiles('lungo-rs/crates/lungo-driver/worker/**') }}
      - name: Build
        run: cargo build --workspace --all-targets --all-features ${{ matrix.exclude }}
      - name: Test
        run: cargo test --workspace --all-features ${{ matrix.exclude }}
      - name: Source tree is unchanged by builds
        shell: bash
        run: |
          git status --porcelain --ignored=no
          test -z "$(git status --porcelain --ignored=no)"

  stdlib-corpus:
    name: Standard library corpus
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-lean
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler-tests/stdlib-corpus
      - uses: actions/cache@v4
        with:
          path: ${{ env.LUNGO_CACHE_DIR }}
          key: lungo-workers-${{ runner.os }}-${{ env.LEAN_TOOLCHAIN }}-${{ hashFiles('crates/lungo-driver/worker/**') }}
      # Every executable declaration of Init and Std, generated as Rust and type-checked.
      - run: cargo check --manifest-path compiler-tests/stdlib-corpus/Cargo.toml
