name: Release

# A tag `v<version>` releases lungo: the runtime for every platform (with its SHA-256 digests in
# the runtime manifest the `lungo` command embeds), the `lungo` command, the crates, and the
# language support libraries (PyPI `lungo-py`, npm `lungo-ts`, the Go module in
# jowharshamshiri/lungo-go, the Swift package in jowharshamshiri/lungo-swift).
#
# `workflow_dispatch` is a dry run: everything is built and checked, nothing is published.
#
# Required: the secrets CARGO_REGISTRY_TOKEN, LUNGO_GO_DEPLOY_KEY and LUNGO_SWIFT_DEPLOY_KEY
# (write deploy keys of the dist repositories); trusted publishing of `lungo-py` on PyPI
# (environment `pypi`) and of `lungo-ts` on npm, both for this workflow.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          version=$(awk '/^\[/ { p = ($0 == "[workspace.package]") } p && /^version = "/ { gsub(/^version = "|"$/, ""); print; exit }' Cargo.toml)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "the tag $GITHUB_REF_NAME does not name the workspace version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  runtime:
    name: Runtime (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, container: 'quay.io/pypa/manylinux_2_28_x86_64', wheel: manylinux_2_28_x86_64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, container: 'quay.io/pypa/manylinux_2_28_aarch64', wheel: manylinux_2_28_aarch64 }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, packages: musl-tools }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, packages: musl-tools }
          - { target: aarch64-apple-darwin, os: macos-latest, wheel: macosx_12_0_arm64 }
          - { target: x86_64-apple-darwin, os: macos-latest, wheel: macosx_12_0_x86_64 }
          - { target: aarch64-apple-ios, os: macos-latest }
          - { target: aarch64-apple-ios-sim, os: macos-latest }
          - { target: x86_64-apple-ios, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, wheel: win_amd64 }
          - { target: x86_64-pc-windows-gnu, os: windows-latest }
          - { target: wasm32-wasip1, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust (in the manylinux container)
        if: matrix.container
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.container }}
        with:
          targets: ${{ matrix.target }}
      - name: System packages
        if: matrix.packages
        run: sudo apt-get update -q && sudo apt-get install -y -q ${{ matrix.packages }}
      - name: MinGW-w64
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: bash
        run: echo 'C:\mingw64\bin' >> "$GITHUB_PATH"
      - name: Runtime package
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          mkdir -p artifacts
          cargo run --release -p lungo-dist -- runtime --target ${{ matrix.target }} --out "dist/lungo-runtime-$VERSION-${{ matrix.target }}"
          cargo run --release -p lungo-dist -- archive "dist/lungo-runtime-$VERSION-${{ matrix.target }}" "artifacts/lungo-runtime-$VERSION-${{ matrix.target }}.tar.gz"
      - name: lungo-py wheel
        if: matrix.wheel
        shell: bash
        run: |
          py=python3
          if [ -n "${{ matrix.container }}" ]; then py=/opt/python/cp312-cp312/bin/python; fi
          if [ "$RUNNER_OS" = Windows ]; then py=python; fi
          cargo run --release -p lungo-dist -- python --runtime "dist/lungo-runtime-$VERSION-${{ matrix.target }}" --out dist/python
          "$py" -m pip install --quiet build
          "$py" -m build --wheel --outdir dist/wheel dist/python
          mkdir -p wheels
          if [ -n "${{ matrix.container }}" ]; then
            auditwheel repair --plat ${{ matrix.wheel }} --wheel-dir wheels dist/wheel/*.whl
          else
            for w in dist/wheel/*.whl; do
              # The wheel carries no extension: its platform is the runtime's.
              "$py" -m pip install --quiet wheel
              "$py" -m wheel tags --platform-tag ${{ matrix.wheel }} --remove "$w"
            done
            cp dist/wheel/*.whl wheels/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: artifacts/
      - uses: actions/upload-artifact@v4
        if: matrix.wheel
        with:
          name: wheel-${{ matrix.target }}
          path: wheels/

  xcframework:
    name: XCFramework
    needs: [version, runtime]
    runs-on: macos-latest
    outputs:
      checksum: ${{ steps.zip.outputs.checksum }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*-apple-*
          path: downloads
          merge-multiple: true
      - id: zip
        run: |
          mkdir -p unpacked universal artifacts
          for a in downloads/*.tar.gz; do tar -xzf "$a" -C unpacked; done
          lib() { echo "unpacked/lungo-runtime-$VERSION-$1/lib/liblungo.a"; }
          mkdir -p universal/macos universal/ios-sim
          lipo -create "$(lib aarch64-apple-darwin)" "$(lib x86_64-apple-darwin)" -output universal/macos/liblungo.a
          lipo -create "$(lib aarch64-apple-ios-sim)" "$(lib x86_64-apple-ios)" -output universal/ios-sim/liblungo.a
          cargo run --release -p lungo-dist -- xcframework \
            --library universal/macos/liblungo.a --library "$(lib aarch64-apple-ios)" --library universal/ios-sim/liblungo.a \
            --out LungoRuntime.xcframework
          ditto -c -k --keepParent LungoRuntime.xcframework artifacts/LungoRuntime.xcframework.zip
          echo "checksum=$(swift package compute-checksum artifacts/LungoRuntime.xcframework.zip)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: xcframework
          path: artifacts/

  manifest:
    name: Runtime manifest
    needs: [version, runtime, xcframework]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: '{runtime-*,xcframework}'
          path: artifacts
          merge-multiple: true
      - run: |
          cargo run --release -p lungo-dist -- manifest --artifacts artifacts \
            --base-url "https://github.com/${{ github.repository }}/releases/download/v$VERSION" \
            --out runtime-manifest.json
          cat runtime-manifest.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/*
      - uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: runtime-manifest.json

  cli:
    name: lungo (${{ matrix.target }})
    needs: [version, manifest]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, packages: musl-tools }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, packages: musl-tools }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: System packages
        if: matrix.packages
        run: sudo apt-get update -q && sudo apt-get install -y -q ${{ matrix.packages }}
      - uses: actions/download-artifact@v4
        with:
          name: manifest
      - name: Build
        shell: bash
        run: |
          LUNGO_RUNTIME_MANIFEST="$PWD/runtime-manifest.json" cargo build --release -p lungo-cli --target ${{ matrix.target }}
          name="lungo-$VERSION-${{ matrix.target }}"
          mkdir -p "$name" artifacts
          cp LICENSE README.md "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/${{ matrix.target }}/release/lungo.exe" "$name/"
            7z a "artifacts/$name.zip" "$name" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/lungo" "$name/"
            tar -czf "artifacts/$name.tar.gz" "$name"
          fi
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/*
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: artifacts/

  github-release:
    name: GitHub release
    needs: [version, runtime, xcframework, manifest, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: '{runtime-*,xcframework,manifest,cli-*}'
          path: release
          merge-multiple: true
      - run: |
          cp scripts/install.sh scripts/install.ps1 release/
          cargo run --release -p lungo-dist -- sums release --out SHA256SUMS
          mv SHA256SUMS release/
          ls -la release
      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" release/* --title "lungo $VERSION" --generate-notes --verify-tag

  crates:
    name: crates.io
    needs: [version, github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ "$PUBLISH" = true ]; then cargo publish --workspace; else cargo publish --workspace --dry-run; fi

  pypi:
    name: PyPI lungo-py
    needs: [version, runtime, github-release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: wheels
          merge-multiple: true
      - run: ls -la wheels
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: env.PUBLISH == 'true'
        with:
          packages-dir: wheels

  npm:
    name: npm lungo-ts
    needs: [version, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: cargo run --release -p lungo-dist -- ts --out dist/ts
      - run: node --test
        working-directory: dist/ts
      - run: npm publish --provenance --access public ${{ env.PUBLISH != 'true' && '--dry-run' || '' }}
        working-directory: dist/ts

  dist-repos:
    name: Go and Swift distribution repositories
    needs: [version, runtime, xcframework, github-release]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: downloads
          merge-multiple: true
      - name: Assemble
        run: |
          mkdir -p unpacked
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-pc-windows-gnu; do
            tar -xzf "downloads/lungo-runtime-$VERSION-$t.tar.gz" -C unpacked
            runtimes+=(--runtime "$t=unpacked/lungo-runtime-$VERSION-$t")
          done
          cargo run --release -p lungo-dist -- go "${runtimes[@]}" --out build/lungo-go
          cargo run --release -p lungo-dist -- swift \
            --url "https://github.com/${{ github.repository }}/releases/download/v$VERSION/LungoRuntime.xcframework.zip" \
            --checksum "${{ needs.xcframework.outputs.checksum }}" \
            --runtime "unpacked/lungo-runtime-$VERSION-aarch64-apple-darwin" --out build/lungo-swift
      - name: Check the Go module
        run: cd build/lungo-go && go vet ./... && go test ./...
      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          GO_KEY: ${{ secrets.LUNGO_GO_DEPLOY_KEY }}
          SWIFT_KEY: ${{ secrets.LUNGO_SWIFT_DEPLOY_KEY }}
        run: |
          publish() {  # REPOSITORY KEY DIRECTORY TAG
            key=$(mktemp)
            printf '%s\n' "$2" > "$key"
            chmod 600 "$key"
            export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            rm -rf "clone-$1"
            git clone "git@github.com:jowharshamshiri/$1.git" "clone-$1"
            rsync -a --delete --exclude .git "$3/" "clone-$1/"
            git -C "clone-$1" -c user.name="lungo release" -c user.email="jowharshamshiri@gmail.com" add -A
            git -C "clone-$1" -c user.name="lungo release" -c user.email="jowharshamshiri@gmail.com" commit -m "lungo $VERSION"
            git -C "clone-$1" tag "$4"
            git -C "clone-$1" push origin HEAD "$4"
            rm -f "$key"
          }
          publish lungo-go "$GO_KEY" build/lungo-go "v$VERSION"
          publish lungo-swift "$SWIFT_KEY" build/lungo-swift "$VERSION"
